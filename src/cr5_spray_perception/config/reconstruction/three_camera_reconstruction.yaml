# CR5 三相机重建 — 融合配置
# Stable V1 calibrated_rig 外参 + 三相机 RGB-D 点云融合

# ── 相机列表 ──
camera_names:
  - cam_front_left
  - cam_front_right
  - cam_rear

# ── rig frame ──
rig_frame: "cam_front_left_color_optical_frame"

# ── 深度范围 ──
depth_min_m: 0.15
depth_max_m: 2.0

# ── 深度单位策略 ──
# 自动检测: uint16 → mm → 转换为米; float32 → 假定为米
# 如果数据集使用毫米编码的 float32, 设置 expected_unit: "mm"
depth:
  expected_unit: "meter"          # "meter" | "mm"
  registered_to_color: true       # 是否要求深度已对齐到彩色

# ── rig-frame ROI (AABB 裁剪, 全场景) ──
# 在 rig frame (cam_front_left optical frame) 中定义
# X: 右, Y: 下, Z: 前
roi_rig:
  min: [-0.5, -1.0, 0.0]    # x_min, y_min, z_min (米)
  max: [2.0, 1.0, 2.5]      # x_max, y_max, z_max (米)

# ── 目标 ROI (TSDF 重建范围) ──
# 从 calibration_target model.sdf GT 几何 + 15mm margin 计算
# 包含: main_body + top_offset_block + 5 panels (CALIBRATION_TARGET_BODY)
# 排除: spreader_bar, left_cable, right_cable, 门架, 地面
# 来源: calibration_target_geometry.py + Oracle 外参 (2026-08-03)
target_roi_rig:
  source: calibration_target_body_gt_with_15mm_margin
  frame: cam_front_left_color_optical_frame
  units: meter
  margin_m: 0.015
  scope: CALIBRATION_TARGET_BODY
  min: [-0.281, -0.216, 0.668]
  max: [0.277, 0.179, 1.195]

# ── 体素下采样 ──
voxel_downsample_m: 0.005        # 5mm 体素

# ── 重叠度量阈值 ──
overlap_thresholds_mm: [10, 20, 30]

# ── 输出路径 ──
# 所有数据放在 ~/cr5_data/reconstruction, 不提交 Git
output:
  base_dir: "~/cr5_data/reconstruction"

# ── 局部对齐诊断 (Local Correspondence Diagnostic) ──
# 使用互为最近邻 + 距离阈值筛选后计算误差
# 用途: 验证局部重合方向正确, 不作为绝对精度评价
# FL-RE (前左↔后) 因为视角相反, 共同可见区域自然较小
# min_common_points 和 min_common_ratio 针对结构差异放宽
# 对齐质量 (median/P95/coverage) 是所有相机对的统一要求
#
# ⚠️ 这些门限为 Gate 1 方向检查临时值, Oracle 完成后重新冻结
local_correspondence_diagnostic:
  provisional_for_gate1_direction_check: true
  metric_scope:
    type: mutual_nearest_neighbor_filtered
    max_correspondence_distance_m: 0.05
    selection_biased: true
    valid_for_absolute_accuracy: false
  max_correspondence_distance_m: 0.05
  min_common_points: 200
  min_common_ratio: 0.005
  median_gate_mm: 12.0
  p95_gate_mm: 30.0
  min_coverage_20mm: 0.80

# ── 同步 Gate ──
sync:
  max_inter_camera_skew_ms: 5.0
