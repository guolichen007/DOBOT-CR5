# 三相机标定 Gazebo 验收姿态集 (稳定版 V1)
# 所有姿态均为 BASE_TARGET + 相对偏移, 不硬编码世界坐标.
# BASE_TARGET 从 simulation_scene.yaml 读取.
#
# 当前 20 组经 V8.20 验证为最优集, V8.21 追加 4 组未改善, 因此固定.

poses:
  # ── 前左相机 (FL) 右侧面观测 ──
  - id: A02
    position: {dx: -0.04, dy: -0.02, dz: 0.03}
    rotation_deg: {roll: 15, pitch: 6, yaw: -12}
    description: "FL 右侧面 + 俯仰复合"

  - id: A03
    position: {dx: 0.00, dy: -0.04, dz: -0.04}
    rotation_deg: {roll: 14, pitch: -3, yaw: -12}
    description: "FL 右侧面组合"

  - id: A05
    position: {dx: -0.08, dy: -0.02, dz: 0.02}
    rotation_deg: {roll: 10, pitch: 8, yaw: -8}
    description: "FL 近距右侧面 + 俯仰"

  - id: A06
    position: {dx: -0.04, dy: -0.02, dz: 0.00}
    rotation_deg: {roll: 14, pitch: -3, yaw: 10}
    description: "FL 右侧面 + 正偏航"

  # ── 前右相机 (FR) 左侧面观测 ──
  - id: B02
    position: {dx: -0.04, dy: 0.02, dz: 0.03}
    rotation_deg: {roll: -15, pitch: 6, yaw: 12}
    description: "FR 左侧面 + 俯仰复合"

  - id: B04
    position: {dx: -0.08, dy: 0.02, dz: 0.02}
    rotation_deg: {roll: -10, pitch: 8, yaw: 8}
    description: "FR 近距左侧面 + 俯仰"

  # ── 深度变化 (关键组) ──
  - id: C01
    position: {dx: -0.10, dy: 0.00, dz: 0.00}
    rotation_deg: {roll: 0, pitch: 5, yaw: 0}
    description: "远距 -100mm"

  - id: C02
    position: {dx: -0.06, dy: 0.00, dz: 0.00}
    rotation_deg: {roll: 0, pitch: 0, yaw: 0}
    description: "近距 -60mm (基准)"

  - id: C03
    position: {dx: 0.04, dy: 0.00, dz: 0.00}
    rotation_deg: {roll: 0, pitch: -5, yaw: 0}
    description: "靠近 +40mm"

  - id: C04
    position: {dx: 0.08, dy: 0.00, dz: 0.00}
    rotation_deg: {roll: 0, pitch: 0, yaw: 0}
    description: "最近 +80mm"

  - id: C05
    position: {dx: -0.04, dy: 0.00, dz: 0.06}
    rotation_deg: {roll: 0, pitch: -5, yaw: 0}
    description: "高位 +60mm"

  - id: C06
    position: {dx: -0.04, dy: 0.00, dz: -0.12}
    rotation_deg: {roll: 0, pitch: 8, yaw: 0}
    description: "低位 -120mm"

  # ── 旋转多样性 ──
  - id: D01
    position: {dx: -0.04, dy: 0.00, dz: 0.00}
    rotation_deg: {roll: 0, pitch: 0, yaw: 15}
    description: "正偏航 +15°"

  - id: D04
    position: {dx: -0.04, dy: 0.00, dz: 0.00}
    rotation_deg: {roll: 0, pitch: -10, yaw: 0}
    description: "负俯仰 -10°"

  - id: D06
    position: {dx: -0.04, dy: 0.03, dz: 0.06}
    rotation_deg: {roll: -10, pitch: -15, yaw: 10}
    description: "镜像复合"

  - id: D08
    position: {dx: -0.04, dy: 0.05, dz: -0.05}
    rotation_deg: {roll: 0, pitch: 0, yaw: 10}
    description: "左侧组合"

  - id: D09
    position: {dx: -0.04, dy: -0.05, dz: -0.05}
    rotation_deg: {roll: 0, pitch: 0, yaw: -10}
    description: "右侧组合"

  - id: D10
    position: {dx: 0.00, dy: 0.05, dz: 0.00}
    rotation_deg: {roll: 0, pitch: 0, yaw: 0}
    description: "基准 +Y 偏移"

  - id: D11
    position: {dx: -0.04, dy: -0.03, dz: 0.02}
    rotation_deg: {roll: 15, pitch: 0, yaw: -5}
    description: "正滚转 +15° 右侧"

  - id: D12
    position: {dx: -0.04, dy: 0.03, dz: 0.02}
    rotation_deg: {roll: -15, pitch: 0, yaw: 5}
    description: "负滚转 -15° 左侧"
