# CR5 三相机标定仿真 — 场景配置 (唯一真值)
# V8.15: 门架 + 标定目标 + 三台固定相机 + 三台独立支架 + 基座
# 所有世界级位姿以此文件为唯一来源，禁止在其他位置硬编码

cr5_base:
  position: {x: 0.0, y: 0.0, z: 0.0}

simple_goalpost_frame:
  center_x: 0.72
  post_y: [-0.62, 0.62]
  height: 1.29
  top_beam_length_y: 1.28
  profile_size: 0.05
  base_plate: [0.24, 0.18, 0.025]
  color_frame: [0.52, 0.52, 0.54, 1.0]

simple_hanging_workpiece:
  # V8.15: target 位于门架中心，spreader_top = target_z + 0.620 ≈ beam_bottom
  position: {x: 0.72, y: 0.0, z: 0.62}
  default_type: motor_housing_cylinder
  types:
    motor_housing_cylinder:
      axis: Y
      body: {length_y: 0.36, radius: 0.105}
      left_end_cap: {length_y: 0.035, radius: 0.115}
      right_end_cap: {length_y: 0.045, radius: 0.115}
      shaft: {length_y: 0.055, radius: 0.040}
      hanger_points_y: [-0.12, 0.12]
      spreader_bar_z: 0.67
      max_axis_m: 0.50
    rectangular_housing:
      main_box: {size_x: 0.18, size_y: 0.36, size_z: 0.26}
      top_box: {size_x: 0.10, size_y: 0.12, size_z: 0.07, offset_y: 0.07, offset_z: 0.165}
      hanger_points_y: [-0.12, 0.12]
      spreader_bar_z: 0.67
      max_axis_m: 0.50

pedestals:
  # V8.20: 同步调整，bracket tip = camera position (delta=0mm)
  - name: pedestal_fl
    base: {x: 0.00, y: -0.66, z: 0}
    height: 0.85
    arm_length: 0.10
  - name: pedestal_fr
    base: {x: 0.00, y: 0.66, z: 0}
    height: 0.85
    arm_length: 0.10
  - name: pedestal_rear
    base: {x: 1.14, y: 0.0, z: 0}
    height: 0.79
    arm_length: 0.10

cameras:
  # V8.15: 靶中心为 look-at 目标
  target: {x: 0.72, y: 0.0, z: 0.62}

  # VM profile: 低分辨率快速刷新
  vm_profile:
    color_width: 424
    color_height: 240
    depth_width: 424
    depth_height: 240
    fps: 5

  # Quality profile: 标准分辨率
  quality_profile:
    color_width: 640
    color_height: 480
    depth_width: 640
    depth_height: 480
    fps: 10

  cameras:
    # V8.20: 恢复历史已验证的成像距离 (~0.93m FL/FR, ~0.54m RE)
    # 前左相机 — FL pedestal bracket tip, 距目标0.93m, 俯角13°
    - name: cam_front_left
      position: {x: 0.10, y: -0.66, z: 0.83}
      roll_offset_deg: 0.0
      keep_horizon: true
      description: "前左侧，距目标0.93m, 俯角13°, 看right+top"

    # 前右相机 — FR pedestal bracket tip, 对称
    - name: cam_front_right
      position: {x: 0.10, y: 0.66, z: 0.83}
      roll_offset_deg: 0.0
      keep_horizon: true
      description: "前右侧，距目标0.93m, 俯角13°, 看left+top"

    # 后相机 — RE pedestal bracket tip, 距目标0.54m
    - name: cam_rear
      position: {x: 1.24, y: 0.0, z: 0.77}
      roll_offset_deg: 0.0
      keep_horizon: true
      description: "正后方，距目标0.54m, front ChArUco近距离高清"

  # 图像质量验收阈值
  image_acceptance:
    min_horizontal_fill_pct: 20
    max_horizontal_fill_pct: 50
    min_vertical_fill_pct: 25
    max_vertical_fill_pct: 55
    max_center_deviation_pct: 15
    max_frame_occlusion_pct: 5
