# CR5 三相机标定仿真 — 场景配置 (唯一真值)
# 门架 + 标定目标 + 三台固定相机 + 基座
# 所有世界级位姿以此文件为唯一来源，禁止在其他位置硬编码

cr5_base:
  position: {x: 0.0, y: 0.0, z: 0.0}

simple_goalpost_frame:
  center_x: 0.68
  post_y: [-0.62, 0.62]
  height: 1.65
  top_beam_length_y: 1.28
  profile_size: 0.05
  base_plate: [0.24, 0.18, 0.025]
  color_frame: [0.52, 0.52, 0.54, 1.0]

simple_hanging_workpiece:
  # 降低高度使前相机更直接看到侧面 + 顶面 (非共面约束)
  position: {x: 0.68, y: 0.0, z: 0.60}
  default_type: motor_housing_cylinder
  types:
    motor_housing_cylinder:
      axis: Y
      body: {length_y: 0.36, radius: 0.105}
      left_end_cap: {length_y: 0.035, radius: 0.115}
      right_end_cap: {length_y: 0.045, radius: 0.115}
      shaft: {length_y: 0.055, radius: 0.040}
      hanger_points_y: [-0.12, 0.12]
      spreader_bar_z: 0.67
      max_axis_m: 0.50
    rectangular_housing:
      main_box: {size_x: 0.18, size_y: 0.36, size_z: 0.26}
      top_box: {size_x: 0.10, size_y: 0.12, size_z: 0.07, offset_y: 0.07, offset_z: 0.165}
      hanger_points_y: [-0.12, 0.12]
      spreader_bar_z: 0.67
      max_axis_m: 0.50

cameras:
  # 目标：工件中心 (降低后匹配新的 spawn 位置)
  target: {x: 0.68, y: 0.0, z: 0.60}

  # VM profile: 低分辨率快速刷新
  vm_profile:
    color_width: 424
    color_height: 240
    depth_width: 424
    depth_height: 240
    fps: 5

  # Quality profile: 标准分辨率
  quality_profile:
    color_width: 640
    color_height: 480
    depth_width: 640
    depth_height: 480
    fps: 10

  cameras:
    # 前左相机 — 靠近目标, 与目标同高, 能同时看到右侧面+前面+顶面
    - name: cam_front_left
      position: {x: -0.05, y: -0.55, z: 0.75}
      roll_offset_deg: 0.0
      keep_horizon: true
      description: "前左侧，距目标约0.85m, 高度接近目标中心"

    # 前右相机 — 对称, 看左侧面+前面+顶面
    - name: cam_front_right
      position: {x: -0.05, y: 0.55, z: 0.75}
      roll_offset_deg: 0.0
      keep_horizon: true
      description: "前右侧，距目标约0.85m, 对称布局"

    # 后相机 — 靠近目标, 正对前面 ChArUco
    - name: cam_rear
      position: {x: 1.20, y: 0.0, z: 0.75}
      roll_offset_deg: 0.0
      keep_horizon: true
      description: "正后方，距目标约0.52m, 前面ChArUco近距离高清"

  # 图像质量验收阈值
  image_acceptance:
    min_horizontal_fill_pct: 20
    max_horizontal_fill_pct: 50
    min_vertical_fill_pct: 25
    max_vertical_fill_pct: 55
    max_center_deviation_pct: 15
    max_frame_occlusion_pct: 5
